<script>
const KEY="tichu-pro-v1",COLS=["#b8432f","#2e7d8c"],PC=["#b8432f","#2e7d8c","#6f9a4a","#e3a72f"];
const BRAND='';

try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);const q=localStorage.getItem(KEY+"-h");if(q){const a=JSON.parse(q);if(Array.isArray(a))H=a}}}catch(e){}
const $=s=>document.querySelector(s);

  <div class="mopt"><label for="lk">Clave de licencia</label><input id="lk" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Introduce tu clave">

/* ---------- lógica de puntuación ---------- */

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40";
  document.body.appendChild(c);const dpr=window.devicePixelRatio||1,W=innerWidth,Hh=innerHeight;
  c.width=W*dpr;c.height=Hh*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#b8432f","#2e7d8c","#6f9a4a","#e3a72f","#a63d2c","#d9cfea","#ffffff"],P=[];
  const burst=(bx,by,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=5+Math.random()*11;
    P.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[i%cols.length]})}};
  const rain=n=>{for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:-10-Math.random()*60,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]})};

  setTimeout(()=>{burst(W*.15,Hh*.5,60);burst(W*.85,Hh*.5,60)},300);
  setTimeout(()=>burst(W/2,Hh*.3,80),800);
  setTimeout(()=>rain(70),1200);

    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;

function dbg(m){if(location.hash!=="#debug")return;let d=document.getElementById("sdbg");if(!d){const sp=document.getElementById("splash");if(!sp)return;d=document.createElement("pre");d.id="sdbg";d.style.cssText="position:absolute;left:8px;top:8px;right:8px;margin:0;padding:6px;background:rgba(255,255,255,.88);color:#000;font:12px/1.3 monospace;white-space:pre-wrap;z-index:5";sp.appendChild(d)}d.textContent+=m+"\n"}
function nota(f,t,d,v){const o=AC.createOscillator(),g=AC.createGain(),o2=AC.createOscillator(),g2=AC.createGain();o.type="triangle";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*3.99;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);g2.gain.setValueAtTime(.0001,t);g2.gain.linearRampToValueAtTime(v*.35,t+.004);g2.gain.exponentialRampToValueAtTime(.0008,t+.12);o.connect(g);g.connect(MG);o2.connect(g2);g2.connect(MG);o.start(t);o.stop(t+d+.05);o2.start(t);o2.stop(t+.2)}
